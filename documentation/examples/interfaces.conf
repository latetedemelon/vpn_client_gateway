# /etc/vpngw/interfaces.conf  --  LAN / WAN interface override
#
# Optional. When absent, the gateway auto-detects:
#   WAN (uplink) = the main-table default-route NIC (ignoring the VPN tunnel)
#   LAN          = the other physical NIC; on a single-NIC box LAN == WAN.
#
# Set these explicitly on multi-NIC hardware, VMs, LXC or Docker where the
# auto-detection might guess wrong.

#lan_iface=eth0
#wan_iface=eth1
