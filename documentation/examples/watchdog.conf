# /etc/vpngw/watchdog.conf  --  connection watchdog + auto-reconnect
#
# Installed/scheduled by setup/vpngw-install-services.sh. The kill switch is
# never touched, so the gateway stays fail-closed while reconnecting.

enabled=true

# Canary host pinged *through the tunnel* to confirm real connectivity.
ping_host=1.1.1.1

# (WireGuard) maximum seconds since the last handshake before the tunnel is
# considered stale.
handshake_max_age=200

# Consecutive failures before reconnecting, and before rotating to a fresh
# recommended server (WireGuard/NordVPN).
max_failures=2
rotate_after=3
