# /etc/vpngw/leak.conf  --  leak protection
#
# Read by the firewall (fw/vpngw-fwenv.sh) and by the web enable/disable path
# (www/vpnmgmt/vpn_backend.php). Defaults are applied when this file is absent.

# Drop all IPv6 forwarding and egress (keeping loopback + ICMPv6/NDP) so a
# dual-stack client cannot bypass the IPv4 tunnel and the kill switch.
# Default: true.
block_ipv6=true

# Force client DNS through the tunnel: DNAT LAN :53 to dns_server so devices
# cannot use their own resolver. Default: false.
force_dns=false

# Where forced DNS is redirected. Defaults to the NordLynx DNS (reached over the
# tunnel). Point this at your Pi-hole's LAN IP to keep using Pi-hole.
dns_server=103.86.96.100
