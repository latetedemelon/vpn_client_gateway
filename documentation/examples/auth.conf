# /etc/vpngw/auth.conf  --  management-page authentication
#
# See documentation/authentication.md. When this file is absent the page is
# unauthenticated (mode=off), preserving the original behaviour.

# mode: off | basic | proxy
mode=off

# --- basic: HTTP Basic auth (RFC 7617) ---
# Create the hash with: setup/set-admin-password.sh  (or password_hash() in PHP)
#mode=basic
#username=admin
#password_hash=$2y$10$REPLACE_WITH_A_REAL_BCRYPT_HASH
#realm=VPN Client Gateway

# --- proxy: trust an authenticated-user header from an upstream SSO proxy ---
# (Authelia, Authentik, oauth2-proxy, Cloudflare Access, Tailscale, …)
#mode=proxy
#user_header=Remote-User
#trusted_proxies=127.0.0.1,::1
