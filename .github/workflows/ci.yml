name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (php-cli, libxml2-utils, shellcheck)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends php-cli libxml2-utils shellcheck

      - name: Run checks
        run: bash tests/run.sh
